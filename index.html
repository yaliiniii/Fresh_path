<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshPath Website</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 p-0 box-border flex flex-col min-h-screen">

  <!-- Navbar -->
  <nav class="bg-white py-4 sticky top-0 z-50 border-b border-[#0000000d]">
    <div class="flex justify-between items-center px-5 mx-auto max-w-7xl">

      <!-- Logo -->
      <a href="./index.html" class="text-2xl font-extrabold flex items-center gap-2 text-[#0F3715]">
        <img src="./assests/freshpath_logo.jpg" class="w-10 h-auto sm:w-12" alt="FreshPath Logo" />
        FreshPath
      </a>

      <!-- Hamburger Button (Mobile Only) -->
      <button onclick="toggleMobileMenu()" class="block md:hidden text-[#0F3715] focus:outline-none">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
        </svg>
      </button>

      <!-- Desktop Nav Links -->
      <div class="hidden md:flex items-center">
        <a class="ml-8 font-medium text-[#0F3715] hover:text-[#2C4C32] transition-colors" href="./index.html">Home</a>
        <a class="ml-8 font-medium text-[#0F3715] hover:text-[#2C4C32] transition-colors"
          href="./html-pages/about.html">About</a>

        <a class="ml-8 mr-2 py-2 px-6 text-sm border-2 border-[#0F3715] rounded-xl font-medium text-[#0F3715]
                 hover:bg-[#DDFFD8] hover:-translate-y-[2px] transition-all duration-300"
          href="./html-pages/user-login.html">
          User Login
        </a>

        <a class="ml-2 py-2 px-6 text-sm border-2 border-[#0F3715] rounded-xl font-medium text-[#0F3715]
                 hover:bg-[#DDFFD8] hover:-translate-y-[2px] transition-all duration-300"
          href="./html-pages/doctor-login.html">
          Doctor Login
        </a>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div id="mobileMenu" class="hidden md:hidden bg-white border-t border-[#0000000d] px-5 py-6">
      <div class="flex flex-col gap-4">
        <a class="font-medium text-[#0F3715] text-lg" href="./index.html">Home</a>
        <a class="font-medium text-[#0F3715] text-lg" href="./html-pages/about.html">About</a>
        <hr class="border-[#0000000d]">
        <a class="py-3 px-6 text-center border-2 border-[#0F3715] rounded-xl font-medium text-[#0F3715] bg-[#DDFFD8]"
          href="./html-pages/user-login.html">
          User Login
        </a>
        <a class="py-3 px-6 text-center border-2 border-[#0F3715] rounded-xl font-medium text-[#0F3715]"
          href="./html-pages/doctor-login.html">
          Doctor Login
        </a>
      </div>
    </div>
  </nav>

  <script>
    function toggleMobileMenu() {
      const menu = document.getElementById('mobileMenu');
      menu.classList.toggle('hidden');
    }
  </script>

  <!-- Hero Section -->
  <section class="py-12 md:py-20 bg-[#f5f9f6]">
    <div class="px-5 mx-auto max-w-7xl">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">

        <!-- Text -->
        <div class="flex flex-col justify-center text-center md:text-left order-2 md:order-1">
          <h1 class="text-4xl md:text-6xl mb-6 font-bold text-[#0F3715] leading-tight">
            Welcome to <span class="text-[#2C4C32]">FreshPath</span>
          </h1>

          <p class="text-lg md:text-xl mb-8 text-[#2C4C32] opacity-90 max-w-xl mx-auto md:mx-0">
            Track your daily habits, visualize your progress, and connect with
            wellness experts all in one beautiful space.
          </p>

          <div class="flex flex-col sm:flex-row gap-4 justify-center md:justify-start">
            <a class="bg-[#0F3715] text-white py-4 px-8 rounded-xl font-semibold
                     shadow-[0_4px_15px_rgba(74,124,89,0.3)] text-center
                     transition-all duration-300 hover:shadow-lg hover:-translate-y-[2px]"
              href="./html-pages/user-signup.html">
              Start My Journey
            </a>

            <a class="border-2 border-[#0F3715] text-[#0F3715] py-4 px-8 rounded-xl font-semibold text-center
                     hover:bg-[#DDFFD8] hover:-translate-y-[2px]
                     transition-all duration-300" href="./html-pages/doctor-signup.html">
              I am a Specialist
            </a>
          </div>
        </div>

        <!-- Image -->
        <div class="flex justify-center items-center order-1 md:order-2">
          <div class="relative w-full max-w-md md:max-w-full">
            <img src="./assests/img1.png" alt="FreshPath Illustration" class="relative w-full h-auto" />
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="mt-auto text-center bg-[#0F3715] py-10 text-white">
    <div class="px-5 mx-auto max-w-7xl">
      <p class="opacity-80">&copy; 2026 FreshPath. All rights reserved.</p>
    </div>
  </footer>

</body>

</html>
